function perf(tid){

  m.forEach(o=>{const j=Math.max(o.f,o.neg+o.adm),c=Math.max(0,o.f-o.neg-o.adm);o.pct=j?Math.round((c-o.neg)/j*100):0});return m}

async function sbFresh(id){

async function avancar0(id,dir,x){

    if(dir===1){c.ok=Date.now();c.por=user;(t.ev=t.ev||[]).push({k:'f',i:t.passo,p:c.pessoa,t:Date.now()})}

  }else{

    const f=t.fluxo[t.passo],tp=(x&&x.tp)||'adm',ob=(x&&x.obs)||'';delete f.ok;delete f.por;(t.ev=t.ev||[]).push({k:'d',i:t.passo,p:f.pessoa,tp,obs:ob,por:user,t:Date.now()});txt=`Devolvido ao passo ${t.passo+1} (${f.etapa}) · ${f.pessoa} · ${tp==='neg'?'negativa':'administrativa'}`+(ob?': '+ob:'')
  }
